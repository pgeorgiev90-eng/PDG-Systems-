<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Потвърждение на имейл | PDG Systems</title><style>body{margin:0;background:#071722;color:#eef8f7;font:15px/1.5 system-ui;display:grid;place-items:center;min-height:100dvh}.card{max-width:460px;width:calc(100% - 60px);padding:28px;background:#102a39;border:1px solid #31505b;border-radius:16px}p{color:#bed4d6}button{font:inherit;padding:11px 18px;border:0;border-radius:8px;background:#4ee1bd;color:#082b28;cursor:pointer;font-weight:bold}a{color:#80e9cc}</style><link rel="stylesheet" href="light-theme.css?v=20261105"><link rel="stylesheet" href="site-metrics.css?v=1"><script src="site-metrics.js?v=1" defer></script></head><body><main class="card"><a href="/" aria-label="PDG Systems LTD — начало"><img src="assets/pdg-systems-logo.svg?v=roof-plug-ltd" alt="PDG Systems LTD" width="438" height="66" style="display:block;width:clamp(128px,17vw,190px);height:auto;max-width:100%;background:#fff;border-radius:4px"></a><h1>Потвърди имейла си</h1><p>Натиснете бутона, ако сте заявили регистрация в PDG Systems.</p><form id="confirm-form"><label for="password">Паролата от регистрацията</label><br><input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="72"><br><button id="confirm" type="submit">Потвърди регистрацията</button></form><p id="status" role="status" aria-live="polite"></p><a href="auth.html">Към входа</a></main><script>
(()=>{const params=new URLSearchParams(location.hash.slice(1)),token=params.get('token')||'';history.replaceState(null,'',location.pathname);const button=document.getElementById('confirm'),status=document.getElementById('status');if(!/^[a-f0-9]{64}$/.test(token)){button.disabled=true;status.textContent='Линкът е невалиден или липсва.';return}document.getElementById('confirm-form').onsubmit=async(event)=>{event.preventDefault();button.disabled=true;status.textContent='Проверка…';try{let r=await fetch('./api/account-draft.php?action=session',{credentials:'same-origin',cache:'no-store'}),s=await r.json();if(!r.ok)throw Error();r=await fetch('./api/registration-draft.php?action=verify',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':s.csrf},body:JSON.stringify({token,password:document.getElementById('password').value})});if(!r.ok)throw Error();window.PDGTrack?.('registration');status.textContent='Имейлът е потвърден. Вече можете да влезете в профила си.'}catch(e){button.disabled=false;status.textContent='Проверете паролата. Възможно е линкът да е изтекъл.'}}})();
</script></body></html>
