<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Първоначална настройка | PDG Systems</title><style>*{box-sizing:border-box}body{margin:0;background:#071722;color:#eef8f7;font:15px/1.5 system-ui;display:grid;place-items:center;min-height:100dvh}.card{max-width:480px;width:calc(100% - 32px);padding:28px;background:#102a39;border:1px solid #31505b;border-radius:16px}label{display:block;margin:14px 0 5px}input,button{width:100%;font:inherit;padding:11px;border-radius:8px;border:1px solid #496d76}input{background:#091d2c;color:white}button{background:#4ee1bd;color:#082b28;cursor:pointer;font-weight:bold;margin-top:20px}p{color:#bed4d6}#status{color:#ffd09b;min-height:24px}a{color:#80e9cc}</style><link rel="stylesheet" href="light-theme.css?v=20261105"></head><body><main class="card"><a href="/" aria-label="PDG Systems LTD — начало"><img src="assets/pdg-systems-logo.svg?v=roof-plug-ltd" alt="PDG Systems LTD" width="438" height="66" style="display:block;width:clamp(128px,17vw,190px);height:auto;max-width:100%;background:#fff;border-radius:4px"></a><h1>Настройка на администратор</h1><p>Еднократна настройка с временния ключ от защитения конфигурационен файл. Не изпращайте ключа или паролата в чат.</p><form id="form"><button id="generate" type="button">Генерирай и копирай временен ключ</button><label for="key">Временен ключ за настройка</label><input id="key" type="password" required autocomplete="off" minlength="64" maxlength="64" pattern="[a-f0-9]{64}"><label for="email">Администраторски имейл</label><input id="email" type="email" required autocomplete="username" maxlength="254"><label for="password">Нова парола</label><input id="password" type="password" required minlength="12" maxlength="72" autocomplete="new-password"><button type="submit">Създай администратор</button></form><p id="status" role="status" aria-live="polite"></p><a href="account-draft.html">Към входа</a></main><script>
(async()=>{const $=x=>document.getElementById(x);let csrf;try{let r=await fetch('./api/account-draft.php?action=session',{credentials:'same-origin',cache:'no-store'});let j=await r.json();if(!r.ok)throw Error();csrf=j.csrf}catch(e){$('status').textContent='Настройката не е достъпна.';return}$('generate').onclick=async()=>{const bytes=crypto.getRandomValues(new Uint8Array(32));const key=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');$('key').value=key;try{await navigator.clipboard.writeText(key);$('status').textContent='Ключът е копиран. Добавете го в защитения файл; не го изпращайте в чат.'}catch(e){$('key').type='text';$('key').select();$('status').textContent='Копирайте маркирания ключ и го добавете в защитения файл.'}};$('form').onsubmit=async e=>{e.preventDefault();let button=$('form').querySelector('button');button.disabled=true;$('status').textContent='Моля, изчакайте…';try{let r=await fetch('./api/setup-admin-draft.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({setup_secret:$('key').value,email:$('email').value.trim(),password:$('password').value})});let j=await r.json();if(!r.ok)throw Error(j.error||'unavailable');$('key').value='';$('password').value='';$('form').hidden=true;$('status').textContent='Администраторът е създаден. Премахнете временния ключ от защитения конфигурационен файл и влезте.'}catch(err){$('status').textContent=err.message==='setup_already_completed'?'Настройката вече е извършена.':'Настройката не успя. Проверете временния ключ и данните.'}finally{button.disabled=false}}})();
</script></body></html>
