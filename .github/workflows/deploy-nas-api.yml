name: Deploy approved NAS read-only API
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-nas-api.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved API
        run: php -l api/nas-export.php
      - name: Publish the single endpoint and provision private config when accessible
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy_nas_api.py
      - name: Save encrypted NAS key and deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nas-integration-delivery
          path: ${{ runner.temp }}/nas-integration-delivery/
          retention-days: 3


# Narrow API-only release; do not run the coordinated full-site publisher.
