name: Test and publish approved CRM admin design
on:
  push:
    branches: [main]
    paths: ['admin-crm.*', 'api/admin-overview.php', '.github/workflows/publish-admin-crm.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdg-admin-crm-release
  cancel-in-progress: false
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pdg-production-deploy
      cancel-in-progress: false
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pdg_test
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and authenticated overview integration
        run: |
          php -l api/admin-overview.php
          node --check admin-crm.js
          node --check admin-orders.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          for name in ['admin-dashboard.html','admin-products-draft.html','admin-electric.html','admin-growth.html']:
              for i,code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',Path(name).read_text(),re.S)):
                  if not code.strip():continue
                  target=Path('/tmp/admin-inline-'+str(i)+'.js');target.write_text(code);subprocess.run(['node','--check',str(target)],check=True)
          PY
          php tests/bootstrap-account-ci.php
          php tests/admin_overview_fixture.php
          php -d auto_prepend_file=/tmp/pdg-test-https.php -S 127.0.0.1:8199 -t . >/tmp/admin-overview-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 20); do if curl -fsS -o /dev/null 'http://127.0.0.1:8199/api/account-draft.php?action=session'; then break; fi; sleep 1; done
          python3 tests/admin_overview_security.py
      - name: Desktop and mobile browser checks
        run: |
          npm install --prefix /tmp/admin-browser playwright@1.56.1 jsdom@26.1.0
          /tmp/admin-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/admin-browser/node_modules node tests/admin_crm_dom_test.cjs
          NODE_PATH=/tmp/admin-browser/node_modules node tests/admin_crm_ui_test.cjs
      - name: Publish administrator files only
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import ftplib,ssl,os,io,urllib.request,urllib.error,hashlib
          from pathlib import Path
          paths=['admin-crm.css','admin-crm.js','api/admin-overview.php','admin-orders.js','admin-orders.html','admin-products-draft.html','admin-electric.html','admin-growth.html','admin-dashboard.html']
          new={'admin-crm.css','admin-crm.js','api/admin-overview.php'}
          root='https://pdgsystems.bg/'
          with urllib.request.urlopen(root+'?admin-before='+os.environ['GITHUB_SHA'],timeout=40) as r: public_before=hashlib.sha256(r.read()).hexdigest()
          backup=Path('production-backup');backup.mkdir(exist_ok=True)
          with ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=60) as ftp:
              ftp.connect(os.environ['FTP_HOST'],21);ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);ftp.prot_p();ftp.cwd('/')
              for p in paths:
                  data=io.BytesIO()
                  try:ftp.retrbinary('RETR '+p,data.write)
                  except ftplib.error_perm as e:
                      if p in new and str(e).startswith('550'):continue
                      raise
                  target=backup/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data.getvalue())
              for p in paths:
                  body=Path(p).read_bytes();ftp.storbinary('STOR '+p+'.crm-upload',io.BytesIO(body))
                  check=io.BytesIO();ftp.retrbinary('RETR '+p+'.crm-upload',check.write);assert check.getvalue()==body
              for p in paths:ftp.rename(p+'.crm-upload',p)
          for p in ['admin-dashboard.html','admin-crm.css','admin-crm.js','admin-orders.html']:
              with urllib.request.urlopen(root+p+'?release='+os.environ['GITHUB_SHA'],timeout=40) as r:assert r.read()==Path(p).read_bytes(),p
          try:urllib.request.urlopen(root+'api/admin-overview.php',timeout=40)
          except urllib.error.HTTPError as e:assert e.code==401
          else:raise AssertionError('Admin overview exposed')
          with urllib.request.urlopen(root+'?admin-after='+os.environ['GITHUB_SHA'],timeout=40) as r:assert hashlib.sha256(r.read()).hexdigest()==public_before,'Public homepage changed'
          print('PASS: exact administrator files deployed; public homepage unchanged; overview requires login')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-crm-evidence-${{ github.run_id }}
          path: |
            production-backup/
            /tmp/admin-crm-*.png
            /tmp/admin-overview-php.log
          retention-days: 30
