name: Publish complete SolaX supplier list with 30 percent markup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solax-supplier-release.yml'
      - 'database/solax-catalog-20261112.json'
      - 'database/solax-photos-20261112.json'
      - 'api/solax-catalog-20261112.php'
      - 'scripts/prepare_solax_photos.py'
      - 'scripts/publish_solax_supplier.py'
      - 'tests/solax_supplier_import.php'
      - 'tests/solax_supplier_catalog.cjs'
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pdg_test
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate full catalog, filters and transactional database import
        run: |
          php -l api/solax-catalog-20261112.php
          php -l api/products.php
          php tests/solax_supplier_import.php
          node tests/solax_supplier_catalog.cjs
          python -m py_compile scripts/prepare_solax_photos.py scripts/publish_solax_supplier.py
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Prepare verified local product photographs
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/prepare_solax_photos.py
      - name: Publish scoped files and verify live catalog
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/publish_solax_supplier.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solax-catalog-backup-${{ github.sha }}
          path: /tmp/solax-production-backup/
          retention-days: 30
