name: Publish nationwide About services
on:
  push:
    branches: [main]
    paths: ['.github/workflows/about-release.yml', 'scripts/publish_about.py']
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check contact script and current source
        run: |
          node --check contact-enquiries.js
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Back up, publish and verify About services
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publish_about.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: about-services-backup
          path: production-backup/
          retention-days: 30
