name: Audit, test and publish external-link cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-security-cleanup.yml','scripts/publish_security_cleanup.py','scripts/prepare_site_vendor.py','tests/vendor_browser_test.cjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static audit and PHP syntax
        run: |
          python3 scripts/security_audit.py --output /tmp/pdg-source-audit.json
          find api -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/public_product_fields_test.php
          node tests/external_links_test.js
      - name: Preserve CAD behavior
        run: |
          npm install --prefix /tmp/pdg-audit-ui --no-audit --no-fund jsdom@26 playwright@1.56.1
          export PDG_JSDOM=/tmp/pdg-audit-ui/node_modules/jsdom
          for test in tests/solar*_test.js tests/electrical*_test.js tests/account_isolation_ui_test.js tests/cad_account_projects_test.js tests/my_projects_ui_test.js; do node "$test"; done
      - name: Prepare pinned same-origin dependencies and existing photos
        run: python3 scripts/prepare_site_vendor.py
      - name: Test real editor and DWG decoder in Chromium
        run: |
          /tmp/pdg-audit-ui/node_modules/.bin/playwright install --with-deps chromium
          php -S 127.0.0.1:8188 -t . tests/browser_audit_router.php > /tmp/pdg-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 20); do if curl -fsS -o /dev/null http://127.0.0.1:8188/roof-cad.php; then break; fi; sleep 1; done
          PDG_PLAYWRIGHT=/tmp/pdg-audit-ui/node_modules/playwright node tests/vendor_browser_test.cjs
      - name: Back up, publish and verify production
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publish_security_cleanup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-cleanup-audit-and-rollback
          path: |
            /tmp/security-rollback
            /tmp/pdg-source-audit.json
            /tmp/pdg-browser.log
            assets/vendor/manifest.json
          retention-days: 30
          include-hidden-files: true
