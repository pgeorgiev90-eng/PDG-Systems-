name: Verify FTPS with pinned hosting IP

on:
  push:
    paths:
      - .github/workflows/verify-ftps-pinned-ip.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test encrypted FTP login and read-only root listing
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          # The reverse-DNS name matches the real certificate but has no public A record.
          # --resolve pins the TLS-verified hostname to the known hosting IP.
          curl --fail --show-error --silent --max-time 35 \
            --ssl-reqd \
            --resolve host-185-80-2-82.superhosting.bg:21:185.80.2.82 \
            --user "$FTP_USER:$FTP_PASSWORD" \
            "ftp://host-185-80-2-82.superhosting.bg:21/" \
            -o /tmp/ftp-root-listing.txt
          echo "FTPS certificate and login verified."
          echo "FTP root listing:"
          head -40 /tmp/ftp-root-listing.txt
