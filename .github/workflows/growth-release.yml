name: Verify and publish PDG development roadmap
on:
  push:
    branches: [main, work/full-development]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdg-growth-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript and PHP syntax
        run: |
          for file in api/*.php social-page.php roof-cad.php electrical-cad.php; do php -l "$file"; done
          php tests/product_copy_test.php
          for file in shopping-tools-core.js shopping-tools.js admin-growth.js cad-shopping.js cad-document.js product.js store.js; do node --check "$file"; done
      - name: Existing editor, catalogue, mobile and UI regressions
        run: |
          npm install --prefix /tmp/pdg-growth-ui --no-audit --no-fund jsdom@26
          export PDG_JSDOM=/tmp/pdg-growth-ui/node_modules/jsdom
          for test in tests/*_test.js tests/*_test.cjs; do
            case "$test" in *vendor_browser_test.cjs) continue;; esac
            node "$test"
          done
  commerce:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pdg_test
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Isolated commerce, permissions and database recovery
        run: |
          php tests/bootstrap-account-ci.php
          php -r '$s=require dirname(getcwd())."/pdg-shop-db.php";$d=new PDO("mysql:host=".$s["host"].";dbname=".$s["database"],$s["username"],$s["password"]);$d->exec("INSERT INTO products(brand,category,code,name,price) VALUES(\"Test\",\"Test\",\"CART-CI-TEST\",\"Cart test\",10.00),(\"Test\",\"Test\",\"NO-PRICE\",\"No price\",NULL)");$q=$d->prepare("INSERT INTO pdg_users(email,password_hash,role) VALUES(?,?,?)");$q->execute(["other@example.test",password_hash("Other-test-123456",PASSWORD_DEFAULT),"customer"]);'
          PHP_CLI_SERVER_WORKERS=4 php -d auto_prepend_file=/tmp/pdg-test-https.php -d "sendmail_path=/bin/sh $GITHUB_WORKSPACE/tests/capture-mail-ci.sh" -S 127.0.0.1:8199 -t . > /tmp/pdg-growth-server.log 2>&1 &
          trap 'cat /tmp/pdg-growth-server.log' EXIT
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8199/api/account-draft.php?action=session && break; sleep 1; done
          python3 tests/commerce_security.py
          php tests/backup_restore.php
  accounts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [account_security, my_projects_security, project_support_security, project_deletion_security, inbox_metrics]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pdg_test
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Separate user and administrator flows
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          php tests/bootstrap-account-ci.php
          php -r '$s=require dirname(getcwd())."/pdg-shop-db.php";$d=new PDO("mysql:host=".$s["host"].";dbname=".$s["database"],$s["username"],$s["password"]);$d->exec(file_get_contents("database/electric-cad-schema.sql"));'
          php -d auto_prepend_file=/tmp/pdg-test-https.php -d "sendmail_path=/bin/sh $GITHUB_WORKSPACE/tests/capture-mail-ci.sh" -S 127.0.0.1:8199 -t . > /tmp/pdg-accounts-server.log 2>&1 &
          trap 'cat /tmp/pdg-accounts-server.log' EXIT
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8199/api/account-draft.php?action=session && break; sleep 1; done
          python3 "tests/$SUITE.py"
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [frontend, commerce, accounts]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pdg-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require current production source
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Back up and stage the complete coordinated release
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/publish_growth.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap-production-backup-${{ github.run_id }}
          path: production-backup/
          retention-days: 30
