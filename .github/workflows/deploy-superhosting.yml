name: Publish PDG Systems to SuperHosting (FTPS)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "Missing FTP_HOST secret"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing FTP_USER secret"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD secret"; exit 1; }

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload website via encrypted FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 20
          set cmd:fail-exit true
          mirror --reverse --verbose --only-newer --no-perms \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob README.md \
            --exclude-glob .gitignore \
            ./ /
          bye
          LFTP
