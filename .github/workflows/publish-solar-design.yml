name: Publish Solar CAD design
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-solar-design.yml'
      - 'roof-cad.php'
      - 'solar-cad-preview.html'
      - 'tests/solar_editor_test.js'
      - 'tests/solar_equipment_test.js'
      - 'catalog-sections.js'
      - 'solar-mounting-core.js'
      - 'solar-mounting.js'
      - 'solar-offer.js'
      - 'solar-offer-core.js'
      - 'database/official-inverter-specs.json'
      - 'api/official-inverters-bootstrap.php'
      - 'api/product-details.php'
      - 'tests/official_inverters_test.js'
      - 'tests/official_inverters_import.php'
      - 'solar-inverter-match.js'
      - 'tests/solar_inverter_match_test.js'
      - 'tests/solar_inverter_match_ui_test.js'
      - 'solar-panel-catalog.js'
      - 'solar-project-start.js'
      - 'solar-project-format.js'
      - 'tests/solar_house_roof_test.js'
      - 'tests/solar_house_roof_3d_test.js'
      - 'tests/solar_single_panel_ui_test.js'
      - 'tests/solar_project_start_test.js'
      - 'tests/solar_project_start_ui_test.js'
      - 'database/cad-panels.json'
      - 'database/intermetal-panels.json'
      - 'api/cad-panels-bootstrap.php'
      - 'tests/solar_panel_catalog_test.js'
      - 'tests/solar_panel_catalog_ui_test.js'
      - 'tests/solar_quote_version_ui_test.js'
      - 'tests/solar_navigation_test.js'
      - 'tests/solar_offer_test.js'
      - 'solar-offer-visuals.js'
      - 'api/solar-yield.php'
      - 'tests/solar_offer_visuals_test.js'
      - 'tests/solar_mounting_test.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[profiles]') }}
    runs-on: ubuntu-latest
    environment: production
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-panels
          MYSQL_DATABASE: pdg_panels
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-panels"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PHP, editor geometry, mobile format, offers and strings
        run: |
          php -l api/cad-panels-bootstrap.php
          php tests/cad_panels_import.php
          php -l api/official-inverters-bootstrap.php
          php -l api/product-details.php
          php tests/official_inverters_import.php
          node tests/official_inverters_test.js
          node --check solar-project-start.js
          node tests/solar_project_start_test.js
          node tests/solar_house_roof_test.js
          node --check solar-panel-catalog.js
          node tests/solar_panel_catalog_test.js
          npm install --prefix /tmp/pdg-panel-ui --no-save --no-audit --no-fund jsdom@31.0.0
          PDG_JSDOM=/tmp/pdg-panel-ui/node_modules/jsdom node tests/solar_panel_catalog_ui_test.js
          PDG_JSDOM=/tmp/pdg-panel-ui/node_modules/jsdom node tests/solar_quote_version_ui_test.js
          PDG_JSDOM=/tmp/pdg-panel-ui/node_modules/jsdom node tests/solar_navigation_test.js
          PDG_JSDOM=/tmp/pdg-panel-ui/node_modules/jsdom node tests/solar_project_start_ui_test.js
          PDG_JSDOM=/tmp/pdg-panel-ui/node_modules/jsdom node tests/solar_house_roof_3d_test.js
          PDG_JSDOM=/tmp/pdg-panel-ui/node_modules/jsdom node tests/solar_single_panel_ui_test.js
          php -l api/solar-yield.php
          node --check solar-offer.js
          node --check solar-offer-visuals.js
          node tests/solar_offer_visuals_test.js
          php -l roof-cad.php
          php -l api/cad-page-access.php
          node tests/solar_editor_test.js
          node tests/solar_equipment_test.js
          node --check solar-mounting-core.js
          node --check solar-mounting.js
          node tests/solar_mounting_test.js
          node tests/solar_mobile_test.js
          node tests/solar_location_test.js
          node tests/solar_offer_test.js
          node tests/solar_string_test.js
          node tests/solar_inverter_match_test.js
          PDG_JSDOM=/tmp/pdg-panel-ui/node_modules/jsdom node tests/solar_inverter_match_ui_test.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for file in ('roof-cad.php','solar-cad-preview.html'):
              for i, code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', Path(file).read_text(), re.S)):
                  if code.strip():
                      p=Path('/tmp/solar-'+str(i)+'.js'); p.write_text(code)
                      subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Verify deployed source and download rollback copies before changing hosting
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import ftplib, ssl, os, hashlib, io, subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          allowed_files=['database/official-inverter-specs.json','api/official-inverters-bootstrap.php','api/product-details.php','database/intermetal-panels.json','database/cad-panels.json','api/cad-panels-bootstrap.php','api/schrack-shop-bootstrap.php','solar-panel-catalog.js','solar-project-start.js','solar-project-format.js','solar-mounting-core.js','solar-mounting.js','solar-offer-core.js','solar-inverter-match.js','solar-offer.js','solar-offer-visuals.js','api/solar-yield.php','solar-cad-preview.html','roof-cad.php']
          expected={name:None for name in allowed_files if name in changed}
          import json,urllib.request
          if {'database/cad-panels.json','database/intermetal-panels.json'} & changed:
              with urllib.request.urlopen('https://pdgsystems.bg/api/products.php?panels=before-'+os.environ['GITHUB_SHA'],timeout=45) as r:Path('/tmp/panels-before.json').write_bytes(r.read())
          Path('/tmp/solar-changed.json').write_text(json.dumps(list(expected)))
          Path('/tmp/solar-rollback/hosting-before').mkdir(parents=True,exist_ok=True)
          Path('/tmp/solar-rollback/source-before').mkdir(exist_ok=True)
          for file in expected:
              for base in ('hosting-before','source-before'):
                  Path('/tmp/solar-rollback/'+base+'/'+file).parent.mkdir(parents=True,exist_ok=True)
              previous=subprocess.run(['git','show','HEAD^:'+file],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if previous.returncode==0:
                  Path('/tmp/solar-rollback/source-before/'+file).write_bytes(previous.stdout)
              else:
                  assert expected[file] is None, 'Missing previous source: '+file
                  Path('/tmp/solar-rollback/source-before/'+file+'.absent').write_text('New file in this release')
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=45) as ftp:
              ftp.connect(os.environ['FTP_HOST'],21)
              ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']); ftp.prot_p(); ftp.cwd('/')
              for file, known in expected.items():
                  data=io.BytesIO()
                  try:
                      ftp.retrbinary('RETR '+file,data.write)
                  except ftplib.error_perm as error:
                      if str(error).startswith('550') and known is None:
                          Path('/tmp/solar-rollback/hosting-before/'+file+'.absent').write_text('Absent before release')
                          continue
                      raise
                  body=data.getvalue()
                  Path('/tmp/solar-rollback/hosting-before/'+file).write_bytes(body)
                  actual=hashlib.sha256(body).hexdigest()
                  new=hashlib.sha256(Path(file).read_bytes()).hexdigest()
                  print('Before deployment:',file,actual,flush=True)
                  previous_release=subprocess.run(['git','show','HEAD^:'+file],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  allowed={known,new}
                  deployed_base=subprocess.run(['git','show','1e90f578463195ddfbac6a4bc47c2e016bcb50c2:'+file],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if deployed_base.returncode==0:
                      allowed.add(hashlib.sha256(deployed_base.stdout).hexdigest())
                  if previous_release.returncode==0:
                      allowed.add(hashlib.sha256(previous_release.stdout).hexdigest())
                  assert actual in allowed, 'Unexpected hosting source; no files uploaded: '+file
      - uses: actions/upload-artifact@v4
        with:
          name: solar-cad-hosting-rollback-${{ github.sha }}
          path: /tmp/solar-rollback/
          retention-days: 30
      - name: Upload only changed Solar CAD files and verify exact bytes
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import ftplib, ssl, os, hashlib, io, urllib.request, time, json
          from pathlib import Path
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=45) as ftp:
              ftp.connect(os.environ['FTP_HOST'],21)
              ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']); ftp.prot_p(); ftp.cwd('/')
              for file in json.loads(Path('/tmp/solar-changed.json').read_text()):
                  body=Path(file).read_bytes()
                  ftp.storbinary('STOR '+file,io.BytesIO(body))
                  check=io.BytesIO(); ftp.retrbinary('RETR '+file,check.write)
                  assert check.getvalue()==body, 'FTPS verification failed: '+file
                  print('Verified hosting source:',file,hashlib.sha256(body).hexdigest(),flush=True)
          time.sleep(4)
          for file in json.loads(Path('/tmp/solar-changed.json').read_text()):
              if file.endswith('.php') or file.startswith('database/'):continue
              request=urllib.request.Request('https://pdgsystems.bg/'+file+'?release='+os.environ['GITHUB_SHA'],headers={'User-Agent':'PDG-Solar-Release-Verification/1.0'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  assert response.status==200
                  assert response.read()==Path(file).read_bytes(), 'Public response differs: '+file
          print('Verified public HTTPS Solar CAD assets',flush=True)

      - name: Verify live store panels and technical details
        shell: python
        run: |
          import json,urllib.request,os
          from pathlib import Path
          if not Path('/tmp/panels-before.json').exists():raise SystemExit(0)
          def get(path):
              with urllib.request.urlopen('https://pdgsystems.bg/'+path+('&' if '?' in path else '?')+'verify='+os.environ['GITHUB_SHA'],timeout=45) as r:return json.load(r)
          before=json.loads(Path('/tmp/panels-before.json').read_text())['products']
          data=get('api/products.php');products=data['products']
          assert {p['id'] for p in before}<={p['id'] for p in products}
          expected=json.loads(Path('database/cad-panels.json').read_text())+json.loads(Path('database/intermetal-panels.json').read_text())
          for row in expected:
              matches=[p for p in products if p['brand']==row['brand'] and p['code']==row['code']]
              assert len(matches)==1 and matches[0]['category']=='Фотоволтаични панели'
              detail=get('api/product-details.php?id='+str(matches[0]['id']))
              fields={f['label']:f['value'] for f in detail['fields']}
              for f in row['fields']:
                  if f['label'] in ['Мощност (Wp)','Дължина (mm)','Ширина (mm)','Voc (V)','Vmp (V)','Imp (A)','Isc (A)','Температурен коефициент Voc (%/°C)']:assert fields[f['label']]==f['value']
              assert detail['product']['price'] is None
              print('Verified live panel:',matches[0]['id'],row['brand'],row['code'],flush=True)
          assert data['prices_visible'] is False
          assert len(get('api/products.php')['products'])==len(products)
          print('PASS: all eight panel models in store, full technical fields, preserved catalogue, no duplicates and protected guest prices',flush=True)

      - name: Verify all live inverter corrections and protected prices
        shell: python
        run: |
          import json,urllib.request,os,concurrent.futures
          from pathlib import Path
          def get(path):
              with urllib.request.urlopen('https://pdgsystems.bg/'+path+('&' if '?' in path else '?')+'verify='+os.environ['GITHUB_SHA'],timeout=45) as r:return json.load(r)
          data=get('api/products.php');products=data['products']
          expected=json.loads(Path('database/official-inverter-specs.json').read_text())
          def verify(row):
              found=[p for p in products if p['brand']==row['brand'] and p['code']==row['code']]
              assert len(found)==1,(row['brand'],row['code'],len(found))
              detail=get('api/product-details.php?id='+str(found[0]['id']))
              fields={f['label']:f['value'] for f in detail['fields']}
              assert fields['CAD: проверка на инвертора']==('проверен' if row.get('verified') else 'непотвърден')
              assert not any('http://' in str(f['value']) or 'https://' in str(f['value']) for f in detail['fields'])
              if row.get('verified'):
                  assert int(fields['Брой MPPT'])==len(row['inputs'])
                  assert float(fields['Допустима мощност на PV масива (W)'])==row['pvPowerW']
                  assert [float(v) for v in fields['Максимален входен ток на MPPT'].split('+')]==row['currents']
                  assert [float(v) for v in fields['Максимален ток на късо съединение на MPPT'].split('+')]==row['shortCurrents']
                  assert float(fields['Минимално MPPT напрежение (V)'])==row['minMppt']
                  assert float(fields['Максимално MPPT напрежение (V)'])==row['maxMppt']
                  assert fields['MPPT / стрингове на MPPT']==str(len(row['inputs']))+'/'+ '+'.join(str(v) for v in row['inputs'])
              assert detail['product']['price'] is None and detail['prices_visible'] is False
              return row['code']
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              checked=list(pool.map(verify,expected))
          assert len(checked)==115
          print('PASS: all115 inverter corrections verified through live APIs;114 source-backed records and1 explicit pending variant; guest prices protected',flush=True)
