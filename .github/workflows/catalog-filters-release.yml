name: Test and publish catalog filters
on:
  push:
    branches: [main]
    paths: ['.github/workflows/catalog-filters-release.yml', 'api/catalog-facets.php', 'catalog-filter-core.js', 'catalog-card.js', 'catalog-app.js', 'catalog-filters.css', 'catalog.html', 'catalog-sections.js', 'tests/catalog_shared_categories_test.cjs']
permissions:
  contents: read
concurrency:
  group: pdg-catalog-filters-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pdg_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptest-root-password" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Validate filters and catalog UI
        run: |
          php -l api/catalog-facets.php
          for file in catalog-filter-core.js catalog-card.js catalog-app.js; do node --check "$file"; done
          node tests/catalog_filters_test.cjs
          node tests/catalog_categories_test.js
          npm install --prefix /tmp/pdg-filter-ui --no-audit --no-fund jsdom@26
          export PDG_JSDOM=/tmp/pdg-filter-ui/node_modules/jsdom
          node tests/catalog_filters_ui_test.cjs
          node tests/catalog_manufacturers_test.cjs
          node tests/catalog_shared_categories_test.cjs
          php tests/bootstrap-account-ci.php
          php -r '$s=require dirname(getcwd())."/pdg-shop-db.php";$d=new PDO("mysql:host=".$s["host"].";dbname=".$s["database"],$s["username"],$s["password"]);$d->exec("INSERT INTO products(brand,category,code,name,price,active) VALUES(\"Test\",\"Инвертори\",\"F1\",\"Main\",10,1),(\"Test\",\"Cat\",\"F2\",\"Other\",11,1),(\"Test\",\"Cat\",\"F3\",\"Inactive\",10,0)");$d->exec("CREATE TABLE pdg_product_fields(id INT AUTO_INCREMENT PRIMARY KEY,product_id BIGINT,label VARCHAR(100),value TEXT,sort_order INT DEFAULT 0)");$d->exec("INSERT INTO pdg_product_fields(product_id,label,value) VALUES(1,\"Номинална AC мощност (kW)\",\"10\"),(1,\"Източник\",\"https://example.test\"),(1,\"Описание\",\"Not a filter\")");require "api/commerce-common.php";pdg_commerce_schema($d);$d->exec("INSERT INTO pdg_product_operations(product_id,stock_quantity,cost_cents) VALUES(1,5,1999)");'
          php -S 127.0.0.1:8091 tests/shop-router.php > /tmp/filter-server.log 2>&1 &
          trap 'cat /tmp/filter-server.log' EXIT
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8091/api/catalog-facets.php && break; sleep 1; done
          python3 tests/catalog_facets_integration.py
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pdg-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require current source
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Back up and publish catalog filters
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publish_catalog_filters.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-filters-backup
          path: production-backup/
          retention-days: 30
