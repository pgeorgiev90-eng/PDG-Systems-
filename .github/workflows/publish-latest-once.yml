name: Publish latest website once
on:
  push:
    paths:
      - '.github/workflows/publish-latest-once.yml'
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    needs: [account-tests, shop-tests]
    runs-on: ubuntu-latest
    environment: production
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: pdg_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1 -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Electric CAD, Solar CAD and catalogue migrations
        run: |
          node --check electrical-busbar-core.js
          node --check electrical-busbar.js
          node tests/electrical_busbar_test.js
          node --check electrical-quote.js
          node --check electrical-quote-core.js
          node --check electrical-cad-design.js
          node --check electrical-catalog.js
          node --check admin-electric.js
          for f in api/electric-common.php api/electric-catalog.php api/electric-enquiries.php api/admin-electric.php; do php -l "$f" || exit; done
          node tests/electrical_quote_test.js
          node --check solar-offer.js
          node tests/solar_offer_test.js
          node tests/solar_string_test.js
          php -l api/product-phase-bootstrap.php
          php -l api/products.php
          php -r 'for($i=0;$i<30;$i++){try{$db=new PDO("mysql:host=127.0.0.1;dbname=pdg_migration_test","root","ci-only-password");$db->query("SELECT 1");exit(0);}catch(Throwable $e){usleep(1000000);}}exit(1);'
          php tests/phase_migration.php
          php -l api/product-spec-bootstrap.php
          php -l api/product-details.php
          php tests/spec_migration.php
          node tests/catalog_specifications_test.js
          php -l api/product-category-bootstrap.php
          php tests/category_migration.php
          node tests/catalog_categories_test.js
          php -l api/solar-yield.php
          php -l api/product-content-bootstrap.php
          php tests/content_migration.php
          node --check product.js
          node --check solar-mobile.js
          node tests/solar_mobile_test.js
          node tests/solar_location_test.js
          python - <<'PYJS'
          from pathlib import Path
          import re, subprocess
          for index, code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', (Path('roof-cad.php').read_text()+Path('electrical-cad.php').read_text()), re.S)):
              if code.strip():
                  script=Path('/tmp/pdg-editor-'+str(index)+'.js'); script.write_text(code)
                  subprocess.run(['node','--check',str(script)],check=True)
          PYJS
      - name: Verify public specification API
        run: |
          php tests/configure_spec_ci.php
          php -S 127.0.0.1:8094 -t . > /tmp/spec-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python - <<'PYTEST'
          import json, urllib.request, time
          for attempt in range(20):
              try:
                  data=json.load(urllib.request.urlopen('http://127.0.0.1:8094/api/products.php',timeout=10))
                  break
              except Exception:
                  if attempt==19: raise
                  time.sleep(.5)
          from pathlib import Path
          original=[p for p in data['products'] if p['brand']!='Schrack Technik']
          schrack=[p for p in data['products'] if p['brand']=='Schrack Technik']
          expected=json.loads(Path('database/schrack-shop-catalog.json').read_text())
          assert len(original)==204 and all(p.get('description') for p in original)
          assert len(schrack)==len(expected)
          assert {p['code']:p['price'] for p in schrack}=={p['code']:p['price'] for p in expected}
          assert all(p['category'].startswith('Електроапаратура / ') for p in schrack)
          assert {p['code']:p['imageUrl'] for p in schrack}=={p['code']:p['image'] or None for p in expected}
          subprocess = __import__('subprocess')
          subprocess.run(['php', 'tests/schrack_shop_photo_migration.php'], check=True)
          refreshed=json.load(urllib.request.urlopen('http://127.0.0.1:8094/api/products.php',timeout=10))
          assert {p['code']:p['imageUrl'] for p in refreshed['products'] if p['brand']=='Schrack Technik'}=={p['code']:p['image'] or None for p in expected}
          repeated=json.load(urllib.request.urlopen('http://127.0.0.1:8094/api/products.php',timeout=10))
          assert len(repeated['products'])==len(data['products'])
          assert sum(bool(p.get('imageUrl')) for p in data['products']) >= 45
          product=next(p for p in data['products'] if p['name']=='X1-BOOST-5K-G4')
          details=json.load(urllib.request.urlopen('http://127.0.0.1:8094/api/product-details.php?id='+str(product['id']),timeout=10))
          assert len(details['fields'])>=8
          assert not any(f['label']=='Източник за фазност' for f in details['fields'])
          assert any(f['label']=='Номинална AC мощност (kW)' and f['value']=='5.1' for f in details['fields'])
          print('PASS: public API serves editable specifications and hides phase-source rows')
          PYTEST
      - name: Validate credentials
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
      - name: Publish website
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import ftplib, ssl, os, io
          from pathlib import Path
          files = ['database/schrack-shop-catalog.json', 'api/schrack-shop-bootstrap.php', 'api/products.php', 'catalog-sections.js', 'catalog.html', 'shop.html']
          with ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=35) as ftp:
              ftp.connect(os.environ['FTP_HOST'],21)
              ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.cwd('/')
              # Stage and check every file before making the new page visible.
              for path in files:
                  data=Path(path).read_bytes()
                  temporary=path+'.pdg-upload'
                  ftp.storbinary('STOR '+temporary,io.BytesIO(data))
                  check=io.BytesIO()
                  ftp.retrbinary('RETR '+temporary,check.write)
                  assert check.getvalue()==data, 'Upload mismatch: '+path
              for path in files:
                  ftp.rename(path+'.pdg-upload',path)
                  print('Published:',path,flush=True)

      - name: Verify deployed Schrack shop categories
        shell: python
        run: |
          import hashlib, json, time, urllib.request, urllib.error
          from pathlib import Path
          root='https://pdgsystems.bg/'
          version=str(time.time_ns())
          def get(path):
              url=root+path+('&' if '?' in path else '?')+'release='+version
              return urllib.request.urlopen(url,timeout=40).read()
          for path in ['shop.html','catalog.html','catalog-sections.js']:
              assert hashlib.sha256(get(path)).digest()==hashlib.sha256(Path(path).read_bytes()).digest(),path
          products=json.loads(get('api/products.php'))['products']
          live={p['code']:p for p in products if p['brand']=='Schrack Technik'}
          expected=json.loads(Path('database/schrack-shop-catalog.json').read_text())
          for p in expected:
              assert live[p['code']]['category']==p['category'],p['code']
              if p['image']:
                  assert live[p['code']]['imageUrl']==p['image'],p['code']
          assert any(p.get('price') and float(p['price'])>0 for p in live.values())
          print('Verified live Schrack category assignment for',len(expected),'products.')


