name: Publish PDG homepage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-homepage.yml
      - index.html
      - electrical-panels.html
      - photovoltaic-systems.html
      - solax-support.html
      - api/enquiry-inbox.php
      - tests/inbox_metrics.py
      - api/admin-site-metrics.php
      - api/site-metrics-common.php
      - api/site-metrics.php
      - site-metrics.js
      - site-metrics.css
      - store.js
      - cart.html
      - catalog.html
      - product.html
      - catalog-sections.js
      - assets/pdg-systems-logo.svg
      - shop.html
      - cart.html
      - product.html
      - catalog.html
      - profile-preview.html
      - admin-orders.html
      - admin-preview.html
      - admin-products-draft.html
      - setup-admin-draft.html
      - maps-designer.html
      - roof-editor.html
      - legacy-editor.html
      - assets/shop-solar-components.webp
      - assets/shop-electrical-equipment.webp
      - assets/shop-cables-accessories.webp
      - api/cad-page-access.php
      - api/account-draft.php
      - api/registration-draft.php
      - auth.html
      - account-draft.html
      - verify-account.html
      - electrical-cad.php
      - electrical-busbar-core.js
      - electrical-busbar.js
      - electrical-connections.js
      - electrical-device-face.js
      - electrical-cad-design.css
      - electrical-catalog.js
      - electrical-dwg-data.js
      - electrical-dwg-worker.js
      - electrical-dwg-import.js
      - solar-cad.webmanifest
      - api/admin-common.php
      - api/cad-projects.php
      - cad-account-projects.js
      - admin-workspace.js
      - admin-dashboard.html
      - api/contact-enquiries.php
      - contact-enquiries.js
      - admin-electric.js
      - admin-electric.html
      - roof-cad.html
      - electrical-cad.html
      - pdg-helper.js
      - assets/solar-cad-homepage.webp
      - assets/electric-cad-homepage.webp

permissions:
  contents: read

concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[growth]') }}
    needs: inbox-tests
    if: ${{ !contains(github.event.head_commit.message, '[profiles]') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check enquiry form
        run: |
          php -l api/contact-enquiries.php
          php -l api/enquiry-inbox.php
          php -l api/admin-site-metrics.php
          php -l api/site-metrics-common.php
          php -l api/site-metrics.php
          node --check site-metrics.js
          node --check contact-enquiries.js
          node --check admin-electric.js
          php -l api/admin-common.php
          php -l api/cad-projects.php
          php -l api/cad-page-access.php
          php -l api/account-draft.php
          php -l api/registration-draft.php
          php -l roof-cad.php
          php -l electrical-cad.php
          node --check electrical-busbar-core.js
          node --check electrical-busbar.js
          node --check electrical-connections.js
          node --check electrical-device-face.js
          node --check electrical-catalog.js
          node --check electrical-dwg-data.js
          node --check electrical-dwg-worker.js
          node --check electrical-dwg-import.js
          node tests/electrical_busbar_test.js
          node tests/electrical_connections_test.cjs
          node --check cad-account-projects.js
          node --check admin-workspace.js
      - name: Reject an outdated production release
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Publish updated website files over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import ftplib
          import os
          import ssl
          import io
          from pathlib import Path

          paths = ('electrical-panels.html', 'photovoltaic-systems.html', 'solax-support.html', 'electrical-busbar-core.js', 'electrical-busbar.js', 'electrical-connections.js', 'electrical-device-face.js', 'electrical-cad-design.css', 'electrical-catalog.js', 'electrical-dwg-data.js', 'electrical-dwg-worker.js', 'electrical-dwg-import.js', 'api/enquiry-inbox.php', 'api/admin-site-metrics.php', 'api/site-metrics-common.php', 'api/site-metrics.php', 'site-metrics.js', 'site-metrics.css', 'store.js', 'cart.html', 'catalog.html', 'product.html', 'catalog-sections.js', 'assets/pdg-systems-logo.svg', 'cart.html', 'product.html', 'catalog.html', 'profile-preview.html', 'admin-orders.html', 'admin-preview.html', 'admin-products-draft.html', 'setup-admin-draft.html', 'maps-designer.html', 'roof-editor.html', 'legacy-editor.html', 'assets/shop-solar-components.webp', 'assets/shop-electrical-equipment.webp', 'assets/shop-cables-accessories.webp', 'shop.html', 'assets/solar-cad-homepage.webp', 'assets/electric-cad-homepage.webp', 'pdg-helper.js', 'api/admin-common.php', 'api/cad-projects.php', 'cad-account-projects.js', 'admin-workspace.js', 'admin-dashboard.html', 'api/cad-page-access.php', 'api/account-draft.php', 'api/registration-draft.php', 'auth.html', 'account-draft.html', 'verify-account.html', 'electrical-cad.php', 'solar-cad.webmanifest', 'roof-cad.html', 'electrical-cad.html', 'api/contact-enquiries.php', 'contact-enquiries.js', 'admin-electric.js', 'admin-electric.html', 'index.html')
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=35) as ftp:
              ftp.connect(os.environ['FTP_HOST'], 21)
              ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              # Save every existing remote file before replacing any file.
              backup = Path('production-backup')
              backup.mkdir(exist_ok=True)
              for path in paths:
                  saved = io.BytesIO()
                  try:
                      ftp.retrbinary(f'RETR /{path}', saved.write)
                  except ftplib.error_perm as error:
                      if str(error).startswith('550') and path in ('electrical-panels.html', 'photovoltaic-systems.html', 'solax-support.html'):
                          continue
                      raise
                  target = backup / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(saved.getvalue())
              for path in paths:
                  temporary = f'/{path}.upload'
                  with open(path, 'rb') as source:
                      ftp.storbinary(f'STOR {temporary}', source)
                  ftp.rename(temporary, f'/{path}')
      - name: Verify deployed CAD access
        run: |
          for editor in roof-cad.php electrical-cad.php; do
            redirect=$(curl -fsS --max-time 20 -o /dev/null -w '%{redirect_url}' "https://pdgsystems.bg/$editor?release=$GITHUB_SHA")
            test "$redirect" = "https://pdgsystems.bg/auth.html?next=$editor"
          done
          curl -fsS --max-time 20 "https://pdgsystems.bg/api/account-draft.php?action=session&release=$GITHUB_SHA" | python -c 'import json,sys; s=json.load(sys.stdin); assert s["user"] is None and s["registration_available"] is True'

      - name: Retain previous production files for rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}
          path: production-backup/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify service pages on the main domain
        shell: python
        run: |
          import hashlib, os, urllib.request
          from pathlib import Path
          for path in ('electrical-panels.html', 'photovoltaic-systems.html', 'solax-support.html', 'index.html'):
              with urllib.request.urlopen('https://pdgsystems.bg/'+path+'?release='+os.environ['GITHUB_SHA'], timeout=40) as response:
                  assert response.status == 200
                  assert hashlib.sha256(response.read()).digest() == hashlib.sha256(Path(path).read_bytes()).digest(), path
              print('Verified service publication:', path)

  inbox-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pdg_test
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Test with isolated accounts, database and mail capture
        run: |
          php tests/bootstrap-account-ci.php
          php -r '$db=new PDO("mysql:host=127.0.0.1;dbname=pdg_test","root","test-root-password");$db->exec(file_get_contents("database/electric-cad-schema.sql"));'
          php -d auto_prepend_file=/tmp/pdg-test-https.php -d "sendmail_path=/bin/sh $GITHUB_WORKSPACE/tests/capture-mail-ci.sh" -S 127.0.0.1:8199 -t . > /tmp/pdg-inbox-server.log 2>&1 &
          trap 'cat /tmp/pdg-inbox-server.log' EXIT
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:8199/api/account-draft.php?action=session; then break; fi
            sleep 1
          done
          python3 tests/inbox_metrics.py
