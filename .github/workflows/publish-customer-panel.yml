name: Publish approved customer dashboard
on:
  push:
    branches: [main]
    paths: ['customer-panel.*', '.github/workflows/publish-customer-panel.yml']
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: production
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pdg_test
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax and account isolation
        run: |
          php -l my-projects.php
          php -l api/my-projects.php
          php -l api/customer-tools.php
          node --check customer-panel.js
          node --check my-projects.js
          php tests/bootstrap-account-ci.php
          php -d auto_prepend_file=/tmp/pdg-test-https.php -S 127.0.0.1:8199 -t . >/tmp/customer-panel-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 20); do if curl -fsS -o /dev/null 'http://127.0.0.1:8199/api/account-draft.php?action=session'; then break; fi; sleep 1; done
          python3 tests/my_projects_security.py
          python3 tests/customer_overview_security.py
          python3 tests/project_support_security.py
      - name: Desktop mobile and existing project checks
        run: |
          npm install --prefix /tmp/customer-ui playwright@1.56.1 jsdom@26.1.0
          /tmp/customer-ui/node_modules/.bin/playwright install --with-deps chromium
          export NODE_PATH=/tmp/customer-ui/node_modules
          node tests/my_projects_ui_test.js
          node tests/project_support_ui_test.cjs
          node tests/project_deletion_ui_test.cjs
          node tests/customer_panel_ui_test.cjs
      - name: Reject outdated release
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Publish approved dashboard and remove installation promotions
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import ftplib,ssl,os,io,urllib.request,urllib.error
          from pathlib import Path
          paths=['account-draft.html', 'admin-dashboard.html', 'admin-electric.html', 'admin-growth.html', 'admin-orders.html', 'admin-preview.html', 'admin-products-draft.html', 'api/customer-tools.php', 'api/my-projects.php', 'app-download.html', 'app-install.js', 'app.html', 'auth.html', 'my-projects.js', 'my-projects.php', 'profile-preview.html', 'shopping-tools.html', 'customer-panel.css', 'customer-panel.js']
          new={'customer-panel.css','customer-panel.js'}
          backup=Path('production-backup')
          with ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=60) as ftp:
              ftp.connect(os.environ['FTP_HOST'],21);ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);ftp.prot_p()
              for path in paths:
                  old=io.BytesIO()
                  try:ftp.retrbinary('RETR /'+path,old.write)
                  except ftplib.error_perm as e:
                      if path in new and str(e).startswith('550'):continue
                      raise
                  dest=backup/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(old.getvalue())
              for path in paths:
                  body=Path(path).read_bytes();ftp.storbinary('STOR /'+path+'.customer-upload',io.BytesIO(body))
                  check=io.BytesIO();ftp.retrbinary('RETR /'+path+'.customer-upload',check.write);assert check.getvalue()==body,path
              for path in paths:ftp.rename('/'+path+'.customer-upload','/'+path)
          for path in paths:
              if path.endswith('.php'):continue
              with urllib.request.urlopen('https://pdgsystems.bg/'+path+'?release='+os.environ['GITHUB_SHA'],timeout=40) as r:assert r.read()==Path(path).read_bytes(),path
          with urllib.request.urlopen('https://pdgsystems.bg/my-projects.php',timeout=40) as r:assert '/auth.html' in r.url,'Personal panel requires login'
          try:urllib.request.urlopen('https://pdgsystems.bg/api/my-projects.php?view=overview',timeout=40)
          except urllib.error.HTTPError as e:assert e.code==401
          else:raise AssertionError('Overview exposed')
          print('PASS: scoped publication, exact live files, private panel and overview protected')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-panel-evidence-${{ github.run_id }}
          path: |
            production-backup/
            /tmp/customer-panel-*.png
            /tmp/customer-panel-php.log
          retention-days: 30
