name: Test and publish related products
on:
  push:
    branches: [main]
    paths: ['.github/workflows/related-products-release.yml', 'api/related-products*.php', 'api/admin-related-products.php', 'admin-related-products*', 'related-products.*']
permissions:
  contents: read
concurrency:
  group: pdg-related-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pdg_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptest-root-password" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Validate and test related products
        run: |
          for file in api/related-products.php api/related-products-common.php api/admin-related-products.php admin-related-products.php social-page.php; do php -l "$file"; done
          node --check related-products.js
          node --check admin-related-products.js
          php tests/bootstrap-account-ci.php
          php -r '$s=require dirname(getcwd())."/pdg-shop-db.php";$d=new PDO("mysql:host=".$s["host"].";dbname=".$s["database"],$s["username"],$s["password"]);$d->exec("INSERT INTO products(brand,category,code,name,price,active) VALUES(\"Test\",\"Cat\",\"R1\",\"Main\",10,1),(\"Test\",\"Cat\",\"R2\",\"Near\",11,1),(\"Other\",\"Cat\",\"R3\",\"Other brand\",10,1),(\"Test\",\"Cat\",\"R4\",\"Far\",100,1),(\"Test\",\"Cat\",\"R5\",\"Inactive\",10,0),(\"Test\",\"Extra\",\"R6\",\"Extra\",5,1)");'
          php -S 127.0.0.1:8091 tests/shop-router.php > /tmp/related-server.log 2>&1 &
          trap 'cat /tmp/related-server.log' EXIT
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8091/api/related-products.php?id=1 && break; sleep 1; done
          python3 tests/related_products_integration.py
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pdg-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require current source
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Back up and publish related products
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publish_related_products.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: related-products-backup
          path: production-backup/
          retention-days: 30
