name: Diagnose account release responses
on:
  push:
    paths:
      - .github/workflows/verify-account-release.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check endpoint status without revealing content
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          root='https://pdgsystems.bg/'
          def request(path,method='GET'):
              req=urllib.request.Request(root+path,method=method,headers={'User-Agent':'PDG-check'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r: return r.status,r.read(),r.headers.get('Content-Type','')
              except urllib.error.HTTPError as e: return e.code,e.read(),e.headers.get('Content-Type','')
          for path,method in [('api/account-draft.php?action=session','GET'),('api/admin-products-draft.php','GET'),('api/setup-admin-draft.php','POST'),('api/products.php','GET'),('auth.html','GET'),('setup-admin-draft.html','GET')]:
              try:
                  code,body,ctype=request(path,method)
                  try: parsed=json.loads(body); kind='JSON'; keys=','.join(sorted(parsed.keys())) if isinstance(parsed,dict) else 'other'
                  except Exception: parsed={};kind='non-JSON';keys=''
                  print(path,'HTTP',code,'type',ctype,'length',len(body),'format',kind,'keys',keys,flush=True)
                  if path=='api/products.php' and isinstance(parsed.get('products'),list): print('Product count',len(parsed['products']),flush=True)
                  if path=='api/account-draft.php?action=session' and kind=='JSON': print('Anonymous session:',parsed.get('user') is None,'registration enabled:',parsed.get('registration_available'),flush=True)
              except Exception as e: print(path,'request failed:',type(e).__name__,flush=True)
          PY
