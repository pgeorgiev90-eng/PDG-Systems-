name: Read-only hosting code audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-hosting-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository and actual hosting without changing files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 scripts/security_audit.py --output /tmp/pdg-source-audit.json
          python3 scripts/security_audit.py --ftp --output /tmp/pdg-hosting-audit.json
      - name: Review deployed source differences without configuration secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/review_hosting_differences.py
      - uses: actions/upload-artifact@v4
        with:
          name: read-only-code-audit
          path: /tmp/pdg-*-audit.json
          retention-days: 30
