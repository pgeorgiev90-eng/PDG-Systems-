name: Publish sales SEO improvements
on:
  push:
    branches: [main]
    paths: ['scripts/publish_sales_seo.py', '.github/workflows/sales-seo.yml', 'solar-cad.html', 'electric-cad.html']
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate SEO renderer
        run: |
          php -l social-page.php
          php tests/product_seo.php
          php tests/seo_render.php
          php tests/social_metadata.php
          python -m py_compile scripts/publish_sales_seo.py
      - name: Require latest production source
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Publish reviewed files and verify live pages
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/publish_sales_seo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-seo-backup-${{ github.run_id }}
          path: production-backup/
          retention-days: 30
