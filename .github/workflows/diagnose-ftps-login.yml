name: Diagnose SuperHosting FTPS login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftps-login:
    runs-on: ubuntu-latest
    steps:
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Check encrypted FTPS login without uploading
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          h = os.environ.get("FTP_HOST", "")
          if not h or h != h.strip() or "://" in h or "/" in h or ":" in h:
              sys.exit("Invalid FTP_HOST format")
          if not os.environ.get("FTP_USER") or not os.environ.get("FTP_PASSWORD"):
              sys.exit("Missing FTP credentials")
          print("Host format and credentials presence: OK")
          PY
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 1
          set net:timeout 15
          set cmd:fail-exit true
          cls -1
          bye
          LFTP
