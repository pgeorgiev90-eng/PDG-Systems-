name: Publish PDG EMS landing page
on:
  push:
    branches: [main]
    paths:
      - 'pdg-ems/**'
      - 'scripts/publish_pdg_ems.py'
      - '.github/workflows/pdg-ems-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdg-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require current production source
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Back up, publish and verify PDG EMS on the official site
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publish_pdg_ems.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdg-ems-backup-${{ github.run_id }}
          path: production-backup/
          retention-days: 30
          if-no-files-found: ignore
