<!doctype html>
<html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>PDG Systems · Помощник</title>
<style>
:root{font-family:system-ui,sans-serif;color:#152b25;background:#edf4f1}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh}
#chat-shell{width:min(100%,720px);height:100dvh;margin:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#f4f8f6}
#chat-head{padding:14px 18px;border-bottom:1px solid #d9e8e1;background:#fff}
#chat-head h1{font-size:17px;margin:0}
#chat-head p{font-size:12px;margin:3px 0 0;color:#566962}
#messages{overflow:auto;overscroll-behavior:contain;padding:14px;display:flex;flex-direction:column;gap:12px}
.message{max-width:88%;align-self:flex-start}
.message.user{align-self:flex-end}
.bubble{margin:0;padding:9px 12px;border:1px solid #dae7e1;border-radius:14px 14px 14px 4px;background:#fff;font-size:14px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.is-waiting::after{content:"…";margin-inline-start:2px;animation:pdg-waiting 1.2s ease-in-out infinite}
@keyframes pdg-waiting{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.bubble.is-waiting::after{animation:none}}
.bubble.is-typing::after{content:"";display:inline-block;width:2px;height:1em;background:currentColor;vertical-align:-.13em;margin-inline-start:2px}
@media(prefers-reduced-motion:reduce){.bubble.is-typing::after{display:none}}
.user .bubble{color:#fff;background:#15634e;border-color:#15634e;border-radius:14px 14px 4px 14px}
.message-label{display:block;margin:0 0 4px 3px;font-size:11px;color:#566962;font-weight:650}
.message.has-offer{width:100%;max-width:100%}
#chat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;padding:9px 12px;background:#fff;border-top:1px solid #d9e8e1}
#chat textarea{width:100%;min-height:44px;max-height:94px;resize:none;border:1px solid #a9c8bd;border-radius:15px;padding:11px 13px;font:14px/1.4 system-ui,sans-serif;color:#152b25}
button{min-height:40px;padding:7px 12px;border:0;border-radius:12px;background:#13684f;color:#fff;font:650 13px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.offer{margin-top:7px;padding:8px;border:1px solid #d4e5dc;border-radius:12px;background:#fff;font-size:13px}
.offer[hidden]{display:none}
.offer fieldset{min-width:0;border:0;margin:0;padding:1px 4px}
.offer legend{font-weight:750}
.offer-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #e0e8e4}
.offer-row a{color:#135d49;overflow-wrap:anywhere}
.offer-product{display:flex;align-items:center;gap:7px}
.offer-product img{flex:none;width:42px;height:42px;object-fit:contain;background:#fff;border:1px solid #e0e8e4;border-radius:6px}
.offer-row small{display:block;margin-top:2px;color:#51665e}
.offer-row input[type=number]{width:52px;padding:5px 3px;border:1px solid #b3ccc1;border-radius:6px}
.offer-sources{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}.offer-sources a{color:#135d49}.battery-link{display:block;margin-top:5px;min-height:30px;padding:4px 8px;border:1px solid #a9c8bd;background:#edf7f2;color:#135d49;font-size:12px}.offer-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.offer p{margin:7px 0}
.offer p:empty{display:none}
@media(min-width:760px){body{padding:16px}#chat-shell{height:calc(100dvh - 32px);border:1px solid #d2e5db;border-radius:19px;overflow:hidden}}
</style>
<main id="chat-shell" aria-label="AI чат на PDG Systems">
<header id="chat-head"><h1>PDG помощник</h1><p>Продуктови въпроси и оферти · не въвеждайте лични данни</p><div data-solax-compatibility></div></header>
<section id="messages" role="log" aria-label="Разговор" aria-live="polite" aria-relevant="additions text">
  <div class="message"><span class="message-label">PDG помощник</span><p class="bubble">Здравейте! Мога да намеря продукти, да покажа снимки и цени или да подготвя оферта. Какво търсите?</p></div>
</section>
<form id="chat"><textarea id="question" rows="1" aria-label="Въпрос за продукт или услуга" required maxlength="300" placeholder="Напишете съобщение…"></textarea><button type="submit">Изпрати</button></form>
</main>
<script>
const form=document.querySelector('#chat'), field=document.querySelector('#question'), log=document.querySelector('#messages'), send=form.querySelector('button');
const money=cents=>(cents/100).toLocaleString('bg-BG',{style:'currency',currency:'EUR'});
const make=(tag,text)=>{const element=document.createElement(tag);if(text!==undefined)element.textContent=text;return element;};
async function customerTools(payload,csrf){
  const options={credentials:'same-origin',cache:'no-store'};
  if(payload)Object.assign(options,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(payload)});
  const response=await fetch('/api/customer-tools.php',options);
  const value=await response.json();
  if(!response.ok)throw new Error(value.error||'tools_unavailable');
  return value;
}
let homeContext='';
const homeRequest=text=>{
  const system=/(?:систем|инсталаци|инвертор)/iu.test(text);
  const solar=/солар|фотоволта/iu.test(text);
  const house=/дом|къщ|жилищ|вил/iu.test(text);
  return system&&((solar&&/систем|инсталаци/iu.test(text))||
    (house&&(solar||/ф(?:а)?з|хибрид|батери|мрежов/iu.test(text))));
};
const homeDetail=text=>/без\s+(?:ток|захранване|мрежа)|няма(?:м)?\s+(?:изградена\s+)?(?:ток|захранване|електричество|мрежа|инфраструктура)|има(?:м)? ток|хладил|осветлен|помпа|фризер|климатик|телевизор|бойлер|полив|ламп|уред|интернет|рутер|лаптоп|компютър|пералн|готвар|печк|котлон|зарядн|уикенд|целогодиш|сезон|лятото|зимата|летни|зимни|почивните дни|събота|неделя|kwh|квтч|квт·ч|\bkw\b|квт|киловат|ф(?:а)?з|батери|покрив|квадрат|засен|резервно|населено|мрежов|хибрид|месец|харча|потреблен|вечер|фактура|изток|запад|юг|север|\d+\s*(?:час|ден|дни|ват|минути)/iu.test(text);
const separateRequest=text=>/^\s*(?:нова тема|друг въпрос|забрави|започни отначало)(?=\s|[.,!?]|$)/iu.test(text)
  || /(?:нов|друг)[а-я]*\s+(?:обект|проект|къщ|вил|имот)|(?:цена|наличност|гаранция)\s+(?:на|за)\s+|[A-Z0-9]{2,}-[A-Z0-9.-]{3,}/iu.test(text);
const homeProposal=text=>/^\s*(?:(?:а|и|тогава|добре)[\s,]+)?(?:препоръч|предлож|генерира|подбер|избер|покажи|дай|какво (?:ще|би)|какъв вариант|каква система)/iu.test(text);
function continueHomeContext(context, question){
  if(!context || separateRequest(question)) return question;
  const newHome = homeRequest(question) && /къщ|жилищ|вил|имот/iu.test(question);
  if(newHome || (!homeDetail(question) && !homeProposal(question))) return question;
  const separator = '\nДопълнение: ';
  const [initial, ...details] = context.split(separator);
  const bytes = new TextEncoder();
  let combined = [initial, ...details, question].join(separator);
  while(bytes.encode(combined).length > 1100 && details.length){
    details.shift();
    combined = [initial, ...details, question].join(separator);
  }
  return bytes.encode(combined).length <= 1100 ? combined : question;
}
function typeReply(out,text){
  if(!text){out.textContent='';return Promise.resolve();}
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const characters=typeof Intl.Segmenter==='function'
    ? Array.from(new Intl.Segmenter('bg',{granularity:'grapheme'}).segment(text),part=>part.segment)
    : Array.from(text);
  const steps=reduced ? text.match(/\S+\s*|\s+/gu) : characters;
  const batch=reduced ? Math.max(1,Math.ceil(steps.length/60)) : Math.max(1,Math.ceil(steps.length/300));
  const interval=reduced ? 85 : 25;
  let shown=0;
  out.setAttribute('aria-busy','true');
  out.classList.add('is-typing');
  out.textContent='';
  return new Promise(resolve=>{
    const timer=setInterval(()=>{
      const atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<36;
      out.textContent+=steps.slice(shown,shown+batch).join('');
      shown+=batch;
      if(shown>=steps.length){
        clearInterval(timer);
        out.classList.remove('is-typing');
        out.removeAttribute('aria-busy');
        resolve();
      }
      if(atBottom)log.scrollTop=log.scrollHeight;
    },interval);
  });
}
async function renderReply(raw,out,offer,requestQuestion){
  let result;
  try{result=JSON.parse(raw);}catch{}
  if(result?.version!==1||!Array.isArray(result.items)||typeof result.text!=='string'){
    await typeReply(out,raw);return;
  }
  if(result.kind==='home_intake'||result.kind==='home_options')homeContext=requestQuestion;
  await typeReply(out,result.text);
  if(Array.isArray(result.sources)){
    const sources=make('p');sources.className='offer-sources';
    const publishers={
      'kb.solaxpower.com':'SolaX','uk.solaxpower.com':'SolaX',
      'www.deyeinverter.com':'Deye','www.dyness.com':'Dyness',
      'technav.ieee.org':'IEEE','www.energy.gov':'U.S. Department of Energy',
      'docs.nrel.gov':'NREL'
    };
    for(const source of result.sources.slice(0,3)){
      try{
        const url=new URL(source);
        if(url.protocol!=='https:'||!Object.hasOwn(publishers,url.hostname))continue;
        const sourceLink=make('a','Източник: '+publishers[url.hostname]);
        sourceLink.href=url.href;sourceLink.target='_blank';sourceLink.rel='noopener';sources.append(sourceLink);
      }catch{}
    }
    if(sources.childElementCount)out.after(sources);
  }
  const items=result.items.filter(item=>Number.isInteger(item.id)&&item.id>0&&typeof item.name==='string').slice(0,8);
  if(!items.length)return;
  const group=make('fieldset'), legend=make('legend','Ориентировъчна оферта');
  group.append(legend);
  const options=items.map(item=>{
    const row=make('div');row.className='offer-row';
    const selected=make('input');selected.type='checkbox';selected.checked=result.kind==='requested';
    selected.setAttribute('aria-label','Включи '+item.name);
    const details=make('div'),link=make('a',item.name);
    link.href='/product.html?id='+item.id;link.target='_blank';link.rel='noopener';
    link.className='offer-product';
    if(typeof item.image_url==='string'&&item.image_url){
      try{
        const photoUrl=new URL(item.image_url,location.origin);
        if(photoUrl.origin===location.origin&&photoUrl.protocol==='https:'){
          const photo=make('img');photo.alt='';photo.width=46;photo.height=46;photo.loading='lazy';photo.decoding='async';
          photo.addEventListener('error',()=>photo.remove(),{once:true});
          photo.src=photoUrl.href;link.prepend(photo);
        }
      }catch{}
    }
    const info=make('small',[item.code,Number.isInteger(item.unit_cents)?money(item.unit_cents)+' с ДДС':'Цена по запитване'].filter(Boolean).join(' · '));
    details.append(link,info);
    if(result.kind!=='compatibility'&&typeof item.battery_model==='string'&&item.battery_model){
      const battery=make('button','Покажи съвместими батерии');
      battery.type='button';battery.className='battery-link';
      battery.onclick=()=>{
        if(send.disabled){out.textContent='Изчакайте текущия отговор и опитайте отново.';return;}
        field.value='Покажи съвместими батерии за '+item.battery_model+'.';
        form.requestSubmit();
      };
      details.append(battery);
    }
    const qty=make('input');qty.type='number';qty.min='1';qty.max='999';qty.value=String(item.quantity||1);qty.setAttribute('aria-label','Количество за '+item.name);
    row.append(selected,details,qty);group.append(row);return {item,selected,qty};
  });
  const total=make('p'), status=make('p');
  status.setAttribute('role','status');
  const actions=make('div');actions.className='offer-actions';
  const check=make('button','Провери за количката'),add=make('button','Добави в количката');
  const login=make('a','Влез в профила'),cart=make('a','Отвори количката');
  login.href='/auth.html?next=cart.html';login.target='_blank';login.rel='noopener';login.hidden=true;
  cart.href='/cart.html';cart.target='_top';cart.hidden=true;add.hidden=true;
  actions.append(check,add,login,cart);offer.append(group,total,actions,status);offer.hidden=false;
  offer.parentElement.classList.add('has-offer');
  let preview,csrf='', busy=false, added=false;
  function selectedRows(){return options.filter(x=>x.selected.checked);}
  function current(){return selectedRows().map(x=>({id:x.item.id,quantity:x.qty.valueAsNumber}));}
  function validate(){return selectedRows().length>0&&selectedRows().every(x=>x.qty.checkValidity()&&Number.isInteger(x.qty.valueAsNumber));}
  function update(){
    preview=null;add.hidden=true;status.textContent='';login.hidden=true;
    check.disabled=busy||added||!validate();
    const rows=selectedRows();
    const priced=rows.every(x=>Number.isInteger(x.item.unit_cents));
    const sum=rows.reduce((acc,x)=>acc+(x.item.unit_cents||0)*(x.qty.valueAsNumber||0),0);
    total.textContent=!rows.length?'Изберете позиции за офертата.':
      priced?'Ориентировъчно: '+money(sum)+' с ДДС. Доставка и монтаж се уточняват отделно.':
      'За част от избраните позиции цената е по запитване.';
  }
  function fail(error){
    if(error.message==='authentication_required'){
      login.hidden=false;
      status.textContent='Влезте в профила си, после се върнете тук и натиснете „Провери за количката“.';
    }else if(error.message==='batch_changed'){
      status.textContent='Цената или наличността се е променила. Проверете отново.';
    }else if(error.message==='batch_unavailable'){
      status.textContent='Поне една позиция вече не може да се добави. Проверете отново.';
    }else status.textContent='Количката временно не е достъпна.';
  }
  function lock(value){
    busy=value;
    for(const x of options){x.selected.disabled=value||added;x.qty.disabled=value||added;}
    check.disabled=value||added||!validate();add.disabled=value||added;
  }
  group.addEventListener('input',update);
  check.onclick=async()=>{
    if(busy||added||!validate())return;
    const selection=current();
    update();lock(true);
    try{
      csrf=(await customerTools()).csrf;
      const result=await customerTools({action:'preview',items:selection},csrf);
      preview={...result,selection};
      total.textContent='Цена за вашия профил: '+money(result.total_cents)+' с ДДС. Доставка и монтаж се уточняват отделно.';
      add.hidden=!result.can_add;
      const problems=(result.items||[]).filter(x=>!x.available).map(x=>x.name).filter(Boolean);
      status.textContent=result.can_add?'Проверете сумата и потвърдете добавянето.':'За потвърждение: '+(problems.join(', ')||'проверете избраните позиции')+'.';
    }catch(error){fail(error);}finally{lock(false);}
  };
  add.onclick=async()=>{
    if(busy||added||!preview?.can_add)return;
    lock(true);
    try{
      await customerTools({action:'add_batch',items:preview.selection,revision:preview.revision},csrf);
      added=true;add.hidden=true;cart.hidden=false;status.textContent='Офертата е добавена в количката.';
    }catch(error){
      preview=null;add.hidden=true;fail(error);
    }finally{lock(false);}
  };
  update();
}
const api=(op)=>'/api/site-ai-chat.php?op='+op;
async function data(response){const value=await response.json();if(!response.ok)throw new Error(value.error);return value;}
async function showRevisedAnswer(id, requestQuestion) {
  const {card,bubble}=message('Преглеждам предишния си отговор и подготвям нов.');
  const offer=make('div');offer.className='offer';offer.hidden=true;card.append(offer);
  const deadline=Date.now()+6*60*1000;
  while(Date.now()<deadline){
    await new Promise(resolve=>setTimeout(resolve,2500));
    const response=await fetch(api('status')+'&id='+encodeURIComponent(id));
    if(response.status>=500)continue;
    const result=await data(response);
    if(result.status!=='done')continue;
    bubble.textContent='';
    await renderReply(result.answer,bubble,offer,requestQuestion);
    addFeedback(card,id,requestQuestion);
    return;
  }
  throw new Error('revision_timeout');
}

function addFeedback(card,id,requestQuestion){
  const group=make('div');group.className='offer-sources';
  const status=make('span','Полезен ли беше отговорът?');status.setAttribute('role','status');
  const buttons=[make('button','Да'),make('button','Не')];
  buttons.forEach((button,index)=>{
    button.type='button';
    button.onclick=async()=>{
      buttons.forEach(item=>item.disabled=true);
      try{
        const vote=await data(await fetch(api('feedback'),{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id,helpful:index===0,...(index===1?{question:requestQuestion}:{})})}));
        status.textContent=vote.revision_id?'Оценката е записана. Подготвям нов опит.':'Благодаря за оценката!';
        buttons.forEach(item=>item.remove());
        if(vote.revision_id){
          try{
            await showRevisedAnswer(vote.revision_id,requestQuestion);
            status.textContent='Оценката е записана. Новият отговор е по-долу.';
          }catch{
            status.textContent='Оценката е записана, но новият отговор се забави.';
          }
        }
      }catch{
        status.textContent='Оценката временно не може да се запише.';
        buttons.forEach(item=>item.disabled=false);
      }
    };
  });
  group.append(status,...buttons);card.append(group);
}
function message(text,user=false){
  const card=make('div'),bubble=make('p',text);
  card.className=user?'message user':'message';bubble.className='bubble';
  const name=make('span',user?'Вие':'PDG помощник');name.className='message-label';
  card.append(name,bubble);log.append(card);log.scrollTop=log.scrollHeight;
  return {card,bubble};
}
field.addEventListener('keydown',event=>{
  if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){
    event.preventDefault();
    if(!send.disabled)form.requestSubmit();
  }
});
form.addEventListener('submit',async event=>{
  event.preventDefault();
  const question=field.value.trim();
  if(!question||send.disabled)return;
  const requestQuestion=continueHomeContext(homeContext,question);
  if(requestQuestion===question)homeContext='';
  send.disabled=true;field.value='';message(question,true);
  const waitingLines=['Нека помисля','Нека погледна','Още проверявам','Подготвям отговора'];
  const {card,bubble}=message(waitingLines[0]);
  bubble.classList.add('is-waiting');
  bubble.setAttribute('aria-busy','true');
  let waitingIndex=0,queued=false;
  const waitingTimer=setInterval(()=>{
    if(queued)return;
    waitingIndex=(waitingIndex+1)%waitingLines.length;
    bubble.textContent=waitingLines[waitingIndex];
  },3200);
  const offer=make('section');offer.className='offer';offer.hidden=true;
  offer.setAttribute('aria-label','Продуктова оферта');card.append(offer);
  try{
    const compatibility = await window.PDGSolaXCompatibility?.answer(question).catch(() => null);
    if (compatibility) {
      bubble.textContent = compatibility;
      return;
    }
    const req=await data(await fetch(api('submit'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:requestQuestion})}));
    const deadline=Date.now()+55*60*1000;
    while(Date.now()<deadline){
      await new Promise(resolve=>setTimeout(resolve,queued?4000:2000));
      let response;
      try{response=await fetch(api('status')+'&id='+encodeURIComponent(req.id));}
      catch{continue;}
      if(response.status>=500)continue;
      const status=await data(response);
      if(status.stage==='queued'){
        queued=true;
        bubble.textContent=status.ahead>0
          ? `Пред вас има ${status.ahead} ${status.ahead===1?'въпрос':'въпроса'}`
          : 'Вие сте следващите на опашката';
      }else if(status.stage==='processing'&&queued){
        queued=false;
        waitingIndex=0;
        bubble.textContent=waitingLines[0];
      }
      if(status.status==='done'){
        clearInterval(waitingTimer);
        bubble.classList.remove('is-waiting');
        await renderReply(status.answer,bubble,offer,requestQuestion);
        addFeedback(card,req.id,requestQuestion);
        return;
      }
    }
    bubble.textContent='Времето за изчакване изтече. Можете да опитате пак или да изпратите запитване през контактите на сайта.';
  }catch(error){
    bubble.textContent=error.message||'Връзката прекъсна.';
  }finally{
    clearInterval(waitingTimer);
    bubble.classList.remove('is-waiting');
    bubble.removeAttribute('aria-busy');
    send.disabled=false;
  }
});
</script><script src="/solax-compatibility.js" defer></script></html>
