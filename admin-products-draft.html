<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление на продукти | PDG Systems</title><style>body{margin:0;background:#071722;color:#eef8f7;font:15px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:30px 20px}h1{margin:0 0 8px}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #496d76}input{background:#102b39;color:white;width:100%;box-sizing:border-box}button{background:#4ee1bd;color:#082b28;cursor:pointer;font-weight:bold}.panel{background:#102a39;border:1px solid #31505b;padding:20px;border-radius:14px;margin:18px 0}label{display:block;margin:12px 0 4px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2c4c56;text-align:left}a{color:#70e4cb}.scroll{overflow:auto}.inline{display:flex;gap:10px;align-items:center}input[type=checkbox]{width:auto}</style><link rel="stylesheet" href="light-theme.css?v=20261105"><link rel="manifest" href="/pdg-app.webmanifest"><meta name="theme-color" content="#087f6b"><link rel="apple-touch-icon" href="/assets/pdg-app-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PDG Systems"><link rel="stylesheet" href="/app-install.css?v=1"><script src="/app-install.js?v=1" defer></script></head><body><main><a href="index.html" aria-label="PDG Systems LTD — начало"><img src="assets/pdg-systems-logo.svg?v=roof-plug-ltd" alt="PDG Systems LTD" width="438" height="66" style="display:block;width:clamp(128px,17vw,190px);height:auto;max-width:100%;background:#fff;border-radius:4px"></a><a href="index.html">← Начало</a><h1>Управление на продукти</h1><p><a href="admin-dashboard.html">Потребители, статистика и допълнителни полета →</a></p><p>Работен вариант. Достъп само за администратор.</p><p id="message" role="status" aria-live="polite">Проверка на достъпа…</p><div id="app" hidden><div class="panel"><h2 id="form-title">Нов продукт</h2><form id="form"><label for="brand">Производител</label><input id="brand" required maxlength="120"><label for="category">Категория</label><input id="category" required maxlength="190"><label for="code">Код</label><input id="code" required maxlength="190"><label for="name">Наименование</label><input id="name" required maxlength="500"><label for="price">Цена в евро без ДДС</label><input id="price" type="number" min="0" step="0.01"><label class="inline"><input type="checkbox" id="active" checked> Активен продукт</label><div class="inline"><button type="submit">Запази</button><button id="clear" type="button">Нов продукт</button></div></form></div><div class="panel"><h2>Продукти</h2><p>Показват се до 500 позиции.</p><label for="product-search">Търсене на продукт</label><input id="product-search" type="search" placeholder="Име, код, производител или категория"><p id="product-count" aria-live="polite"></p><div class="scroll"><table><thead><tr><th>Наименование</th><th>Код</th><th>Цена без ДДС</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main><script>
(async()=>{let csrf='',items=[],editing=0;const $=id=>document.getElementById(id),message=t=>$('message').textContent=t;async function req(url,options){let r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});let j=await r.json();if(!r.ok)throw new Error(j.error||'unavailable');return j}function clear(){editing=0;$('form').reset();$('active').checked=true;$('form-title').textContent='Нов продукт'}function render(){let rows=$('rows');rows.replaceChildren();const q=$('product-search').value.trim().toLocaleLowerCase('bg');const filtered=items.filter(p=>[p.name,p.code,p.brand,p.category].join(' ').toLocaleLowerCase('bg').includes(q));$('product-count').textContent=filtered.length+' намерени продукта'+(items.length===500?' (търсене сред последните 500)':'');for(const p of filtered){let tr=document.createElement('tr');for(const v of [p.name,p.code,p.price??'По запитване']){let td=document.createElement('td');td.textContent=v;tr.append(td)}let td=document.createElement('td'),b=document.createElement('button');b.type='button';b.textContent='Редакция';b.onclick=()=>{editing=Number(p.id);for(const k of ['brand','category','code','name','price'])$(k).value=p[k]??'';$('active').checked=Number(p.active)===1;$('form-title').textContent='Редакция на продукт';window.scrollTo({top:0,behavior:'smooth'})};const specs=document.createElement('a');specs.href='admin-dashboard.html?product_id='+encodeURIComponent(p.id);specs.textContent='Характеристики';specs.style.marginLeft='12px';const preview=document.createElement('a');preview.href='product.html?id='+encodeURIComponent(p.id);preview.textContent='Преглед';preview.style.marginLeft='12px';td.append(b,specs,preview);tr.append(td);rows.append(tr)}}async function refresh(){const result=await req('./api/admin-products-draft.php');items=result.products;render()}try{let s=await req('./api/account-draft.php?action=session');if(!s.user||s.user.role!=='admin'){message('Необходим е администраторски вход.');return}csrf=s.csrf;await refresh();$('app').hidden=false;message('Вход като администратор: '+s.user.email)}catch(e){message('Управлението още не е активирано или нямате достъп.');return}$('product-search').addEventListener('input',render);$('clear').onclick=clear;$('form').onsubmit=async e=>{e.preventDefault();let data={id:editing,active:$('active').checked};for(const k of ['brand','category','code','name','price'])data[k]=$(k).value.trim();try{await req('./api/admin-products-draft.php',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});clear();await refresh();message('Продуктът е запазен.')}catch(err){message('Промяната не е записана. Проверете данните и опитайте отново.')}}})();
</script></body></html>
